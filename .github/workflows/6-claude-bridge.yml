name: 6. Claude bridge for the phone app
# The Arcade Studio phone app commits a request to bridge/requests/; Claude Code answers it here on
# the Claude subscription (CLAUDE_CODE_OAUTH_TOKEN) and the answer is committed to bridge/results/.
on:
  push:
    paths:
      - "bridge/requests/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-bridge
  cancel-in-progress: false
jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g -s @anthropic-ai/claude-code
      - name: Answer the requests
        run: python3 bridge/answer.py
      - name: Hand the answers back
        run: |
          git config user.name "claude-bridge"
          git config user.email "claude-bridge@users.noreply.github.com"
          git add -A bridge
          git diff --cached --quiet && exit 0
          git commit -q -m "Claude bridge: answers"
          # The phone may push a new request meanwhile; rebase onto it and try again.
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 3; done
          exit 1
