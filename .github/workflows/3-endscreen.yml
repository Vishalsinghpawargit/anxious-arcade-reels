name: 3. Add end screen + Mortals
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Video link: Google Drive share link, YouTube link, or direct .mp4 link"
        required: true
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      TITLE: "Video with end screen"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
      - name: Add the end screen
        run: python -m reels.media endscreen --video "${{ inputs.video }}"
      - name: Publish to Releases
        if: always() && hashFiles('out/*.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "reel-${{ github.run_id }}" out/*.mp4 --title "$TITLE" --notes "Made by run ${{ github.run_number }}. Tap a file below to download it."
