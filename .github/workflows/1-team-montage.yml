name: 1. Team fight montage
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Broadcast YouTube link(s), separated by spaces"
        required: true
      teams:
        description: "Teams as TAG=Full name, separated by ;  e.g. TAG=Team Apex Gaming; SOUL=iQOO SOUL"
        required: true
      max_seconds:
        description: "Longest Reel in seconds (180 = 3 min)"
        default: "180"
      footer:
        description: "Bottom line"
        default: "BMSD 2026"
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      TITLE: "Team montage: ${{ inputs.teams }}"
    steps:
      - name: Free disk space for the broadcast
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
      - name: Make the Reels
        run: python -m reels.broadcast team --urls "${{ inputs.urls }}" --teams "${{ inputs.teams }}" --max "${{ inputs.max_seconds }}" --footer "${{ inputs.footer }}"
      - name: Publish to Releases
        if: always() && hashFiles('out/*.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "reel-${{ github.run_id }}" out/*.mp4 --title "$TITLE" --notes "Made by run ${{ github.run_number }}. Tap a file below to download it."
